<style>
/* Bench tool: sticky header with run bar, one tab per step. Coomassie-blue accent. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --ink: #161a24; --muted: #5b6273; --line: #dde0e8;
  --accent: #2a4bb3; --accent-soft: #e6ebfa;
  --good: #1f7a4a; --warn: #9a5b00; --warn-soft: #fff3df; --bad: #b3261e; --bad-soft: #fde8e6; --gel: #dfe6f6;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12141b; --surface: #1b1e27; --ink: #e8eaf0; --muted: #9aa1b2; --line: #2e3240;
    --accent: #8ea6ff; --accent-soft: #252c47; --good: #5fcf8f; --warn: #f0b354; --warn-soft: #3a2e17; --bad: #ff8a80; --bad-soft: #3d1f1d; --gel: #263052; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #12141b; --surface: #1b1e27; --ink: #e8eaf0; --muted: #9aa1b2; --line: #2e3240;
  --accent: #8ea6ff; --accent-soft: #252c47; --good: #5fcf8f; --warn: #f0b354; --warn-soft: #3a2e17; --bad: #ff8a80; --bad-soft: #3d1f1d; --gel: #263052; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
p { margin: 0; }
.num, td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; max-width: 1240px; margin: 0 auto; }
.top-row .spacer { flex: 1; }
.ver { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 16px; max-width: 1240px; margin: 0 auto; }
nav.tabs a { padding: 9px 11px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; font-size: 14px; }
nav.tabs a .n { font-family: var(--font-mono); font-size: 12px; margin-right: 5px; opacity: .7; }
nav.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.runbar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 8px 16px; max-width: 1240px; margin: 0 auto; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.runbar label { display: inline-flex; gap: 6px; align-items: center; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

main { max-width: 1240px; margin: 0 auto; padding: 16px; }
section.tab { display: none; gap: 16px; }
section.tab.active { display: grid; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.card-head .hint { color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; }
.fields { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.field { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
input[data-num] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; width: 84px; text-align: right; }
td input { width: 100%; min-width: 62px; }
td input.name, input.name { text-align: left; min-width: 120px; font-family: var(--font-body); }
input[type="checkbox"] { width: auto; accent-color: var(--accent); }
textarea.json { width: 100%; min-height: 420px; font-family: var(--font-mono); font-size: 12px; }
button { font: inherit; font-size: 14px; border-radius: 6px; padding: 6px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
:root[data-theme="dark"] button.primary { color: #10131c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #10131c; } }
button.ghost { border-color: transparent; color: var(--muted); padding: 3px 7px; }
button.ghost:hover { color: var(--ink); }
button.ghost.del:hover { color: var(--bad); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: bottom; }

td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.k { width: 140px; vertical-align: top; font-weight: 600; }
tr.dim td { color: var(--muted); }

.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; font-family: var(--font-body); margin: 1px 0; }
.chip.ok { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.chip.warn { color: var(--warn); background: var(--warn-soft); }
.chip.bad { color: var(--bad); background: var(--bad-soft); }
.chip.info { color: var(--accent); background: var(--accent-soft); }
.note { font-size: 13px; color: var(--muted); }
.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 14px; }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.callout.bad { border-color: var(--bad); background: var(--bad-soft); }

.fitbox { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }

.fitopt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.fitopt .big { font-family: var(--font-mono); font-size: 19px; font-weight: 500; }
.fitopt .eq { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
svg.chart { width: 100%; height: auto; max-height: 320px; }

svg.chart .grid { stroke: var(--line); }
svg.chart .axis { stroke: var(--muted); }
svg.chart .curve { fill: none; stroke: var(--accent); stroke-width: 2; }
svg.chart .curve2 { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: .7; }
svg.chart .std { fill: var(--accent); }
svg.chart .smp { fill: var(--warn); stroke: var(--surface); }
svg.chart .smp.bad { fill: var(--bad); }

.gel { background: var(--gel); border-radius: 8px; padding: 12px; overflow-x: auto; }
.gel + .gel { margin-top: 10px; }
.gel .gt { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.wells { display: grid; gap: 5px; min-width: max-content; }
.well { display: grid; gap: 5px; justify-items: center; width: 52px; }
.well .slot { width: 100%; height: 14px; border-radius: 0 0 4px 4px; background: color-mix(in srgb, var(--ink) 15%, transparent); }
.well.filled .slot { background: var(--accent); }
.well.ladder .slot { background: linear-gradient(90deg, #3b6fd8, #d8336b, #4c9a2a, #e3a300, #7d4bc4); }
.well .lane-n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.well .lab { font-size: 11px; height: 92px; writing-mode: vertical-rl; transform: rotate(180deg); overflow: hidden; }

.strips { display: grid; gap: 6px; }
.strip { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.strip .range { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.cutline { font-size: 13px; color: var(--accent); display: flex; align-items: center; gap: 8px; padding-left: 6px; }
.cutline::before { content: ""; flex: 0 0 36px; border-top: 2px dashed var(--accent); }
.band { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; border: 1px solid rgb(0 0 0 / .15); }

.recipe { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.recipe h2 { font-size: 15px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } .strip { grid-template-columns: 1fr; } }
@media print {
  header.top, .noprint, nav { display: none !important; }
  body { background: #fff; color: #000; }
  section.tab { display: none !important; }
  section.tab.active { display: grid !important; }
  .card { border: 0; padding: 0; }
}

<body>
<header class="top">
  <div class="top-row">
    <h1>Western Blot Planner</h1><span class="ver">v1.0</span>
    <span class="spacer"></span>
    <button type="button" data-act="exportPlan">Save plan to file</button>
    <label class="noprint" style="display:inline-flex"><input type="file" id="importPlan" accept=".json,application/json" hidden><button type="button" data-act="importPlan">Open plan file</button></label>
    <button type="button" data-act="newPlan">New experiment</button>
  </div>
  <nav class="tabs" aria-label="Steps">
    <a href="#assay"><span class="n">1</span>Protein assay</a>
    <a href="#targets"><span class="n">2</span>Targets</a>
    <a href="#loading"><span class="n">3</span>Loading</a>
    <a href="#gel"><span class="n">4</span>Gel</a>
    <a href="#blotting"><span class="n">5</span>Blotting</a>
    <a href="#buffers"><span class="n">6</span>Buffers</a>
    <a href="#summary"><span class="n">7</span>Summary</a>
    <a href="#recipes">Recipes</a>
    <a href="#presets">Lab presets</a>
  </nav>
  <div class="runbar">
    <label for="runName">Experiment <input id="runName" class="name" data-bind="name" placeholder="e.g. HuR knockdown, blot 2" style="width:230px"></label>
    <label for="runCopies" title="Identical gels to run today (e.g. one gel per set of antibodies)">Identical gels today <input id="runCopies" data-num data-bind="copies" data-re="1" style="width:52px"></label>
    <span id="runInfo"></span>
  </div>
</header>

<main>
  <section class="tab" id="tab-assay"></section>
  <section class="tab" id="tab-targets"></section>
  <section class="tab" id="tab-loading"></section>
  <section class="tab" id="tab-gel"></section>
  <section class="tab" id="tab-blotting"></section>
  <section class="tab" id="tab-buffers"></section>
  <section class="tab" id="tab-summary"></section>
  <section class="tab" id="tab-recipes"></section>
  <section class="tab" id="tab-presets"></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   1. SETUP: presets, helpers
   ===================================================================== */
const APP_VERSION = "1.0";
// Keep the original file text so the lab manager can download an updated copy with new presets.
const APP_SOURCE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
const EMBEDDED_PRESETS = JSON.parse(document.getElementById("lab-presets").textContent);
const OVERRIDE_KEY = "wbplanner.presetsOverride.v1";   // lab manager's unpublished edits (this browser only)
const DRAFT_KEY = "wbplanner.draft.v1";                // current experiment (this browser only)

function loadPresets() {
  try { const o = localStorage.getItem(OVERRIDE_KEY); if (o) return { P: JSON.parse(o), overridden: true }; } catch {}
  return { P: JSON.parse(JSON.stringify(EMBEDDED_PRESETS)), overridden: false };
}
let { P, overridden: PRESETS_OVERRIDDEN } = loadPresets();

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9);
// Accepts "1,25" and "1.25"
function num(v) { if (v === null || v === undefined || v === "") return NaN; if (typeof v === "number") return v; const n = parseFloat(String(v).trim().replace(",", ".")); return isFinite(n) ? n : NaN; }
function fmt(v, d = 2) { return isFinite(v) ? Number(v).toFixed(d) : "–"; }
function fmtUL(v) { if (!isFinite(v)) return "–"; if (Math.abs(v) >= 100) return v.toFixed(0); if (Math.abs(v) >= 10) return v.toFixed(1); return v.toFixed(2); }
function fmtML(v) { if (!isFinite(v)) return "–"; return v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400); }
function chips(list) { return list.map(([c, t]) => `<span class="chip ${c}">${esc(t)}</span>`).join(" "); }
const isPhospho = t => /^p[-\s]|phospho/i.test(t || "");
const BAND_COLORS = { blue: "#3b6fd8", red: "#d8336b", green: "#4c9a2a", yellow: "#e3a300", purple: "#7d4bc4", orange: "#ef7d22" };
function bandHTML(b) { return `<span class="band" style="background:${BAND_COLORS[b[1]] || "#888"}"></span>${b[0]} kDa (${b[1]})`; }

/* =====================================================================
   2. EXPERIMENT STATE (per person, kept in this browser + plan files)
   ===================================================================== */
function newSample(name = "", dil = P.dc.defaultDilution) { return { id: uid(), name, dil, abs: ["", "", ""], conc: "", avail: "" }; }
function newTarget() { return { id: uid(), ab: "", target: "", kDa: "", host: "Rabbit", dil: "", ml: P.antibodyMlPerStrip }; }
function blankState() {
  return { v: APP_VERSION, example: false, name: "", copies: 1,
    assay: { reps: P.dc.replicates, fit: "linear", stds: P.dc.standards.map(c => ({ c, abs: ["", "", ""] })), samples: [newSample()] },
    load: { ug: 20, laneMode: "auto", laneUL: 20, sb: 0, loadsPlanned: 1, fmt: "auto", pct: "" },
    targets: [newTarget()] };
}
function exampleState() {
  const S = blankState(); S.example = true; S.name = "Example: HuR / CSDE1 blot";
  S.assay.fit = "linear";
  const abs = [[0.095, 0.099], [0.162, 0.158], [0.221, 0.229], [0.338, 0.344], [0.441, 0.447], [0.503, 0.511]];
  S.assay.stds.forEach((s, i) => s.abs = [...(abs[i] || ["", ""]), ""]);
  S.assay.samples = [["siCtrl #1", .388, .394], ["siCtrl #2", .402, .396], ["siHuR #1", .351, .361], ["siHuR #2", .365, .372], ["siCSDE1 #1", .298, .304], ["siCSDE1 #2", .322, .318]]
    .map(([n, a, b]) => { const s = newSample(n, 1); s.abs = [a, b, ""]; s.avail = 100; return s; });
  S.load.ug = 20; S.load.loadsPlanned = 3;
  S.targets = [{ ab: "a6" }, { ab: "a3" }, { ab: "a1" }, { ab: "a4" }].map(t => ({ ...newTarget(), ...t }));
  return S;
}
function loadDraft() { try { const s = localStorage.getItem(DRAFT_KEY); return s ? JSON.parse(s) : null; } catch { return null; } }
function saveDraft() { clearTimeout(saveDraft._t); saveDraft._t = setTimeout(() => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(S)); } catch {} }, 300); }
let S = loadDraft() || exampleState();

/* =====================================================================
   3. CALCULATIONS (pure functions)
   ===================================================================== */
// --- Standard curve fits ---
function fitLinear(x, y) {
  const n = x.length, mx = x.reduce((a, b) => a + b, 0) / n, my = y.reduce((a, b) => a + b, 0) / n;
  let sxx = 0, sxy = 0; for (let i = 0; i < n; i++) { sxx += (x[i] - mx) ** 2; sxy += (x[i] - mx) * (y[i] - my); }
  const m = sxy / sxx; return withR2({ type: "linear", coef: [my - m * mx, m, 0] }, x, y);
}
function fitQuad(x, y) {   // least squares y = a + b·x + c·x²
  const s = [0, 0, 0, 0, 0], t = [0, 0, 0];
  for (let i = 0; i < x.length; i++) { let p = 1; for (let k = 0; k < 5; k++) { s[k] += p; if (k < 3) t[k] += p * y[i]; p *= x[i]; } }
  const M = [[s[0], s[1], s[2], t[0]], [s[1], s[2], s[3], t[1]], [s[2], s[3], s[4], t[2]]];
  for (let c = 0; c < 3; c++) {
    let piv = c; for (let r = c + 1; r < 3; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    [M[c], M[piv]] = [M[piv], M[c]]; if (Math.abs(M[c][c]) < 1e-14) return null;
    for (let r = 0; r < 3; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k < 4; k++) M[r][k] -= f * M[c][k]; }
  }
  return withR2({ type: "quad", coef: [M[0][3] / M[0][0], M[1][3] / M[1][1], M[2][3] / M[2][2]] }, x, y);
}
const predict = (f, x) => f.coef[0] + f.coef[1] * x + f.coef[2] * x * x;
function invert(f, y) {
  const [a, b, c] = f.coef; if (Math.abs(c) < 1e-12) return (y - a) / b;
  const D = b * b - 4 * c * (a - y); if (D < 0) return NaN;
  return (-b + Math.sqrt(D)) / (2 * c);   // root on the rising part of the curve
}
function withR2(f, x, y) { const my = y.reduce((a, b) => a + b, 0) / y.length; let r = 0, t = 0; x.forEach((xi, i) => { r += (y[i] - predict(f, xi)) ** 2; t += (y[i] - my) ** 2; }); f.r2 = t > 0 ? 1 - r / t : NaN; return f; }
const mean = a => a.length ? a.reduce((p, q) => p + q, 0) / a.length : NaN;
const sd = a => { if (a.length < 2) return NaN; const m = mean(a); return Math.sqrt(a.reduce((p, q) => p + (q - m) ** 2, 0) / (a.length - 1)); };

function computeAssay() {
  const a = S.assay, xs = [], ys = [];
  const stds = a.stds.map(s => { const c = num(s.c), vals = s.abs.slice(0, a.reps).map(num).filter(isFinite); if (isFinite(c)) vals.forEach(v => { xs.push(c); ys.push(v); }); return { c, vals, mean: mean(vals) }; });
  const nConc = new Set(xs).size;
  const lin = nConc >= 2 ? fitLinear(xs, ys) : null, quad = nConc >= 3 ? fitQuad(xs, ys) : null;
  const fit = a.fit === "quad" ? (quad || lin) : lin;
  const valid = stds.filter(s => isFinite(s.c) && isFinite(s.mean)), nz = valid.filter(s => s.c > 0);
  const range = nz.length ? { lowAbs: Math.min(...nz.map(s => s.mean)), highAbs: Math.max(...valid.map(s => s.mean)) } : null;
  stds.forEach(s => { s.back = fit && isFinite(s.mean) ? invert(fit, s.mean) : NaN; s.err = s.c > 0 ? (s.back - s.c) / s.c * 100 : NaN; });
  const errOf = f => f ? Math.max(...nz.map(s => Math.abs((invert(f, s.mean) - s.c) / s.c * 100)).filter(isFinite)) : NaN;
  const samples = a.samples.map(sm => {
    const vals = sm.abs.slice(0, a.reps).map(num).filter(isFinite), m = mean(vals), cv = vals.length > 1 ? sd(vals) / m * 100 : NaN;
    const dil = num(sm.dil) > 0 ? num(sm.dil) : 1, well = fit && isFinite(m) ? invert(fit, m) : NaN, flags = [];
    if (isFinite(m) && range) { if (m > range.highAbs) flags.push(["bad", "Above top standard: dilute and re-read"]); else if (m < range.lowAbs) flags.push(["warn", "Below lowest standard"]); }
    if (isFinite(cv) && cv > 10) flags.push(["warn", `Replicates differ (CV ${cv.toFixed(0)}%)`]);
    const manual = num(sm.conc);
    return { id: sm.id, name: sm.name || "Unnamed", mean: m, cv, well, stock: well * dil, conc: isFinite(manual) ? manual : well * dil, manual: isFinite(manual), avail: num(sm.avail), flags };
  });
  return { fit, lin, quad, stds, samples, nConc, worstLin: errOf(lin), worstQuad: errOf(quad) };
}

// --- Loading ---
function sampleBuffer() { return P.sampleBuffers[S.load.sb] || P.sampleBuffers[0]; }
function laneFractions() { const sb = sampleBuffer(), X = num(sb.x) || 6, dtt = num(sb.dttFinalMM) > 0 ? num(sb.dttFinalMM) / (num(P.dttStockM) * 1000) : 0; return { X, sbFrac: 1 / X, dttFrac: dtt }; }
function computeLoading(A) {
  const L = S.load, ug = num(L.ug), { X, sbFrac, dttFrac } = laneFractions(), free = 1 - sbFrac - dttFrac;
  const withC = A.samples.filter(s => s.conc > 0);
  const limiting = withC.length ? withC.reduce((a, b) => a.conc < b.conc ? a : b) : null;
  // auto lane volume = smallest whole µL that fits the most dilute sample (never below the preset minimum)
  const autoUL = limiting ? Math.max(num(P.loading.minLaneUL), Math.ceil((ug / limiting.conc) / free - 1e-9)) : num(P.loading.minLaneUL);
  const lane = L.laneMode === "auto" ? autoUL : num(L.laneUL);
  const copies = Math.max(1, Math.round(num(S.copies)) || 1), loads = Math.max(1, Math.round(num(L.loadsPlanned)) || 1), reserve = 1 + num(P.loading.reserveExtraPct) / 100;
  const rows = A.samples.map(s => {
    const r = { ...s, sbUL: lane * sbFrac, dttUL: lane * dttFrac, lys: NaN, top: NaN, need: NaN, loadsFromAvail: NaN, flags: [] };
    if (!(s.conc > 0)) { r.flags.push(["info", "No concentration yet"]); return r; }
    r.lys = ug / s.conc; r.top = lane - r.sbUL - r.dttUL - r.lys;
    r.need = r.lys * loads * reserve;
    if (isFinite(s.avail)) r.loadsFromAvail = Math.floor(s.avail / (r.lys * reserve));
    if (r.top < -1e-9) r.flags.push(["bad", `Doesn't fit: at most ${fmt(s.conc * lane * free, 1)} µg in ${lane} µL`]);
    if (r.lys * copies < num(P.loading.minPipetteUL)) r.flags.push(["warn", `Under ${P.loading.minPipetteUL} µL: dilute the lysate first`]);
    if (isFinite(s.avail) && s.avail < r.need) r.flags.push(["warn", `Only enough for ${r.loadsFromAvail} load${r.loadsFromAvail === 1 ? "" : "s"}`]);
    return r;
  });
  return { rows, ug, lane, autoUL, X, free, copies, loads, reserve, limiting, sb: sampleBuffer() };
}
// Max equal µg that fits each well size, given the most dilute sample
function maxUgPerWell(A) {
  const lim = computeLoading(A).limiting, { sbFrac, dttFrac } = laneFractions(); if (!lim) return [];
  const out = [];
  for (const w of Object.keys(P.wells)) for (const mm of Object.keys(P.wells[w])) { const v = num(P.wells[w][mm]); out.push({ w, mm, v, ug: Math.floor(lim.conc * v * (1 - sbFrac - dttFrac) * 2) / 2 }); }
  return out.sort((a, b) => a.v - b.v);
}

// --- Gel format: wells & thickness from number of samples and lane volume ---
function formats() { const out = []; for (const w of Object.keys(P.wells)) for (const mm of Object.keys(P.wells[w])) out.push({ wells: +w, mm, maxUL: num(P.wells[w][mm]), key: `${w}-${mm}` }); return out; }
function recommendFormat(nSamples, laneUL) {
  const fits = formats().filter(f => f.maxUL >= laneUL).map(f => ({ ...f, gels: Math.max(1, Math.ceil(nSamples / (f.wells - 1))) }))
    .sort((a, b) => a.gels - b.gels || num(a.mm) - num(b.mm) || a.wells - b.wells);
  return fits[0] || null;
}
function chosenFormat(A, R) {
  const n = A.samples.length, rec = recommendFormat(n, R.lane);
  let f = rec;
  if (S.load.fmt !== "auto") { const m = formats().find(x => x.key === S.load.fmt); if (m) f = { ...m, gels: Math.max(1, Math.ceil(n / (m.wells - 1))) }; }
  return { rec, f, overWell: f ? R.lane > f.maxUL : true };
}
// Lane map: ladder in lane 1 of every gel, samples split evenly across gels in the order of the sample table
function laneMap(A, f) {
  if (!f) return [];
  const per = Math.ceil(A.samples.length / f.gels), gels = [];
  for (let g = 0; g < f.gels; g++) {
    const ss = A.samples.slice(g * per, (g + 1) * per);
    gels.push(Array.from({ length: f.wells }, (_, i) => i === 0 ? { ladder: true } : ss[i - 1] ? { s: ss[i - 1] } : {}));
  }
  return gels;
}

// --- Targets ---
const abById = id => P.antibodies.find(a => a.id === id);
function resolvedTargets() {
  return S.targets.map(t => {
    const a = t.ab ? abById(t.ab) : null;
    const r = { id: t.id, ab: a, target: a ? a.target : t.target, kDa: a ? num(a.kDa) : num(t.kDa), host: a ? a.host : t.host,
      dil: num(t.dil) || (a ? num(a.dil) : NaN), diluent: a ? a.diluent : "", ml: num(t.ml) || num(P.antibodyMlPerStrip), verified: a ? a.verified : null };
    r.sec = P.secondaries.find(s => s.against === r.host && s.status === "active") || null;
    return r;
  }).filter(r => r.target);
}
function groupStrips(T) {
  const rows = T.filter(t => t.kDa > 0).sort((a, b) => b.kDa - a.kDa), groups = [];
  rows.forEach(r => { const g = groups[groups.length - 1]; if (g && Math.min(...g.map(x => x.kDa)) / r.kDa < num(P.sameStripRatio)) g.push(r); else groups.push([r]); });
  const cuts = [];
  for (let i = 0; i < groups.length - 1; i++) {
    const hi = Math.min(...groups[i].map(r => r.kDa)), lo = Math.max(...groups[i + 1].map(r => r.kDa)), at = Math.sqrt(hi * lo);
    const between = P.ladder.bands.filter(b => b[0] < hi && b[0] > lo);
    const nearest = between.sort((a, b) => Math.abs(Math.log(a[0] / at)) - Math.abs(Math.log(b[0] / at)))[0];
    const above = P.ladder.bands.filter(b => b[0] >= at).sort((a, b) => a[0] - b[0])[0], below = P.ladder.bands.filter(b => b[0] < at).sort((a, b) => b[0] - a[0])[0];
    cuts.push({ kDa: Math.round(at), band: nearest || null, above, below, hi, lo });
  }
  return { groups, cuts, noMw: T.filter(t => !(t.kDa > 0)) };
}
function suggestPct(T) {
  const v = T.map(t => t.kDa).filter(m => m > 0); if (!v.length) return null;
  const lo = Math.min(...v), hi = Math.max(...v), lc = Math.log(Math.sqrt(lo * hi));
  const span = lo === hi ? `${lo} kDa` : `${lo}–${hi} kDa`;
  const fits = P.gelRanges.filter(([, a, b]) => lo >= a && hi <= b).map(([p, a, b]) => ({ p, a, b, d: Math.abs(Math.log(Math.sqrt(a * b)) - lc) })).sort((x, y) => x.d - y.d);
  if (fits.length) return { pct: fits[0].p, ok: true, why: `${fits[0].p}% separates ~${fits[0].a}–${fits[0].b} kDa and covers your targets (${span})` };
  // no single % fits: pick the one whose range the targets miss by the least (summed on a log scale)
  const comp = P.gelRanges.map(([p, a, b]) => ({ p, a, b, miss: v.filter(m => m < a || m > b), dist: v.reduce((s, m) => s + Math.max(0, Math.log(a / m), Math.log(m / b)), 0) })).sort((x, y) => x.dist - y.dist)[0];
  return { pct: comp.p, ok: false, why: `no single percentage covers ${span}. ${comp.p}% is the closest (${comp.miss.map(m => m + " kDa").join(", ")} outside its ~${comp.a}–${comp.b} kDa range). Consider two gels, or a precast gradient gel.` };
}
function gelPct(T) { const o = num(S.load.pct); if (o > 0) return o; const s = suggestPct(T); return s ? s.pct : 10; }

// Compatibility and other checks for the antibody plan
function antibodyChecks(T, strips) {
  const out = [];
  T.forEach(t => {
    if (t.ab && t.ab.status !== "active") out.push(["bad", `${t.target}: this vial is marked "${t.ab.status}"`]);
    if (!t.host) out.push(["warn", `${t.target}: host species unknown, so the secondary can't be chosen. Fill it in Lab presets.`]);
    else if (!t.sec) out.push(["bad", `${t.target}: no active HRP secondary against ${t.host} in the lab list`]);
    if (!(t.kDa > 0)) out.push(["warn", `${t.target}: no kDa, so it can't be placed on the gel or membrane`]);
    if (!isFinite(t.dil)) out.push(["warn", `${t.target}: no lab-validated dilution; use the datasheet's and record it`]);
    if (isPhospho(t.target) && /milk/i.test(t.diluent || P.blocking.agent)) out.push(["warn", `${t.target}: phospho-antibody in milk. Milk contains casein (a phosphoprotein); 5% BSA is usually recommended`]);
    if (t.verified === false) out.push(["info", `${t.target}: kDa/host not yet verified against the datasheet`]);
  });
  strips.groups.forEach((g, i) => {
    if (g.length < 2) return;
    const hosts = new Set(g.map(t => t.host));
    if (hosts.has("Rat") && hosts.has("Mouse")) out.push(["bad", `Strip ${i + 1}: rat and mouse primaries on the same strip. Anti-mouse and anti-rat secondaries cross-react unless cross-adsorbed; strip very thoroughly between them`]);
    // a secondary raised in host X will be detected by the secondary against X
    g.forEach(p => g.forEach(q => { if (p !== q && p.sec && q.sec && p.sec.raisedIn && p.sec.raisedIn === q.host)
      out.push(["bad", `Strip ${i + 1}: the anti-${q.host.toLowerCase()} secondary for ${q.target} will detect the ${p.sec.raisedIn.toLowerCase()}-raised secondary used for ${p.target}`]); }));

}
function blotAdvice(T) {
  const kd = T.map(t => t.kDa).filter(m => m > 0); if (!kd.length) return [];
  const hi = Math.max(...kd), lo = Math.min(...kd), out = [];
  if (hi >= 150) out.push(["warn", `Largest target ${hi} kDa: with ${P.transfer.methanolPct}% methanol and ${P.transfer.conditions}, large proteins may transfer incompletely. Check with Ponceau; lowering methanol to 10% or a longer transfer helps.`]);
  if (lo < 20) out.push(["warn", `Smallest target ${lo} kDa: small proteins can pass through a 0.45 µm membrane. Use 0.2 µm if possible and don't over-transfer.`]);
  return out;
}

// --- Gel casting (Molecular Cloning tables scaled to the needed volume) ---
const roundUp = (v, step) => Math.ceil(v / step - 1e-9) * step;
function castComponents(per10, V) {

  out[0] = Math.round((V - out.slice(1).reduce((a, b) => a + b, 0)) * 10) / 10;
  return out;
}
function computeCasting(pct, f, nGels) {
  const cas = num(P.cassetteMl[f.mm]), ex = 1 + num(P.castExtraPct) / 100, step = num(P.castRoundUpMl) || 0.5;
  const Vres = roundUp(cas * num(P.resolvingFraction) * nGels * ex, step), Vst = roundUp(cas * (1 - num(P.resolvingFraction)) * nGels * ex, step);
  const key = String(pct), table = P.resolving.per10ml[key];
  return { pct, Vres, Vst, res: table ? castComponents(table, Vres) : null, st: castComponents(P.stacking.per10ml, Vst), nGels };
}

// --- Buffers ---
function computeBuffers(nGels, nStrips) {
  const runTanks = Math.ceil(nGels / 4), lastTank = nGels - (runTanks - 1) * 4;
  const runMl = (runTanks - 1) * num(P.running.mlUpTo4Gels) + (lastTank <= 2 ? num(P.running.mlUpTo2Gels) : num(P.running.mlUpTo4Gels));
  const trTanks = Math.ceil(nGels / num(P.transfer.cassettesPerTank)), trMl = trTanks * num(P.transfer.tankMl), meoh = trMl * num(P.transfer.methanolPct) / 100;
  const tb = P.tbst, tbstMl = nStrips * (num(tb.mlPerWash) * num(tb.washesPerRound) * num(tb.rounds)) * 1.1;
  const blockMl = nStrips * num(P.blocking.mlPerStrip) * 1.1, abMl = nStrips * num(P.antibodyMlPerStrip) * 1.1;   // secondary is diluted in blocking solution
  const milkMl = blockMl + abMl, milkG = milkMl * num(P.blocking.pct) / 100;
  return { run: { tanks: runTanks, ml: runMl, stock: runMl / num(P.running.stockX) }, tr: { tanks: trTanks, ml: trMl, base: trMl - meoh, meoh },
    tbst: { ml: tbstMl + milkMl, tween: (tbstMl + milkMl) / 1000 * num(tb.tweenMlPerL) }, block: { ml: milkMl, g: milkG }, ecl: nGels * num(P.ecl.mlPerMembrane) };
}

/* =====================================================================
   4. PLAN: everything computed once, used by all tabs
   ===================================================================== */
function plan() {
  const A = computeAssay(), R = computeLoading(A), F = chosenFormat(A, R), T = resolvedTargets(), strips = groupStrips(T);
  const pct = gelPct(T), sug = suggestPct(T), copies = R.copies, nGels = F.f ? F.f.gels * copies : 0;
  const cast = F.f ? computeCasting(pct, F.f, nGels) : null;
  const nStrips = Math.max(1, strips.groups.length) * nGels;
  return { A, R, F, T, strips, pct, sug, nGels, cast, lanes: laneMap(A, F.f), checks: antibodyChecks(T, strips), advice: blotAdvice(T), buf: computeBuffers(Math.max(1, nGels), nStrips), nStrips };
}
function issues(Pl) {
  const out = [];

  Pl.R.rows.forEach(r => r.flags.forEach(f => (f[0] === "bad" || f[0] === "warn") && out.push([f[0], `${r.name}: ${f[1]}`])));
  if (!Pl.F.f) out.push(["bad", `No gel format holds ${Pl.R.lane} µL per lane. Lower the µg per lane.`]);
  else if (Pl.F.overWell) out.push(["bad", `${Pl.R.lane} µL per lane is more than a ${Pl.F.f.wells}-well ${Pl.F.f.mm} mm well holds (${Pl.F.f.maxUL} µL)`]);
  if (S.assay.fit === "quad" && Pl.A.nConc < 5) out.push(["warn", `Quadratic fit with only ${Pl.A.nConc} standard concentrations: little margin for error`]);
  if (!Pl.T.length) out.push(["warn", "No targets yet: gel % and blotting plan can't be worked out"]);
  else if (Pl.sug && !Pl.sug.ok) out.push(["warn", "Gel %: " + Pl.sug.why]);
  Pl.checks.filter(c => c[0] !== "info").forEach(c => out.push(c));
  Pl.advice.forEach(c => out.push(c));

}

function updateAssay() {

    set("xf" + i, s.flags.length ? chips(s.flags) : isFinite(s.stock) ? `<span class="chip ok">In range</span>` : ""); });

    const opt = (k, f, label, err) => `<button type="button" class="fitopt" data-act="setFit" data-fit="${k}" aria-pressed="${S.assay.fit === k}"><span>${label}</span>
      <span class="big">${f ? "R² " + f.r2.toFixed(4) : "–"}</span><span class="eq">${f ? `worst standard error ${fmt(err, 1)}%` : (k === "quad" ? "needs 3+ concentrations" : "needs 2+ concentrations")}</span></button>`;

}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

    ${ticks(yMax).map(v => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(2)}</text>`).join("")}
    ${ticks(xMax).map(v => `<text x="${X(v)}" y="${H - m.b + 16}" text-anchor="middle">${v.toFixed(1)}</text>`).join("")}
    <line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}"/>
    <text x="${(W + m.l) / 2}" y="${H - 3}" text-anchor="middle">BSA mg/mL (in well)</text>
    ${other ? `<path class="curve2" d="${path(other)}"/>` : ""}<path class="curve" d="${path(A.fit)}"/>

  </svg><div class="row note"><span>● standards</span><span>▲ samples</span><span>dashed: the other model</span></div>`;
}

}

// ---------- 5 Blotting ----------
function renderBlotting() {
  const Pl = plan(), st = Pl.strips;

    const top = i === 0 ? "top" : `≈${st.cuts[i - 1].kDa} kDa`, bot = i === st.groups.length - 1 ? "bottom" : `≈${st.cuts[i].kDa} kDa`;
    const ordered = [...g].sort((a, b) => isPhospho(b.target) - isPhospho(a.target));
    const tl = ordered.map(t => `<b>${esc(t.target)}</b> <span class="note">${t.kDa} kDa, ${esc(t.host || "?")}${isFinite(t.dil) ? ", 1:" + t.dil : ""}</span>`).join(g.length > 1 ? `<br><span class="note">↓ strip: ${esc(P.stripping.conditions)}; reblock, then</span><br>` : "");
    let cut = "";

      cut = `<div class="cutline">Cut ${c.band ? `at the ${bandHTML(c.band)} marker` : `between the ${c.above ? bandHTML(c.above) : "top"} and ${c.below ? bandHTML(c.below) : "bottom"} markers`} (between ${c.lo} and ${c.hi} kDa)</div>`; }
    return `<div class="strip"><span class="range">Strip ${i + 1}<br>${top} → ${bot}</span><div>${tl}${g.length > 1 ? `<div class="note" style="margin-top:4px">Too close in size to cut apart: probe in this order${g.some(t => isPhospho(t.target)) ? " (phospho first, then total)" : ""}.</div>` : ""}</div></div>${cut}`;
  }).join("");
  const abRows = Pl.T.map(t => { const ml = t.ml * Pl.nGels; return `<tr><td>${esc(t.target)}</td><td class="num">1:${isFinite(t.dil) ? t.dil : "?"}</td><td class="num"><b>${isFinite(t.dil) ? fmtUL(ml * 1000 / t.dil) : "–"}</b> µL in ${fmtML(ml)} mL</td><td>${t.sec ? esc(t.sec.name) + " " + esc(t.sec.catalog) : "–"}</td><td class="num">${t.sec ? fmtUL(ml * 1000 / t.sec.dil) + " µL" : "–"}</td></tr>`; }).join("");
  $("#tab-blotting").innerHTML = `
  <div class="grid2">
    <div class="card">
      <div class="card-head"><h2>Transfer and detection</h2><span class="hint">Lab SOP. Warnings appear only when your targets need something different.</span></div>

        <tr><td class="k">Transfer</td><td>${esc(P.transfer.method)}: ${esc(P.transfer.conditions)}; ${P.transfer.methanolPct}% methanol${P.transfer.membrane ? "; " + esc(P.transfer.membrane) : ""}</td></tr>
        <tr><td class="k">Check</td><td>Ponceau S after transfer, before cutting.</td></tr>
        <tr><td class="k">Blocking</td><td>${P.blocking.pct}% ${esc(P.blocking.agent.toLowerCase())} in TBS-T, ${esc(P.blocking.time)}</td></tr>
        <tr><td class="k">Primary</td><td>2 h RT or overnight at 4 °C on a roller</td></tr>
        <tr><td class="k">Secondary</td><td>${P.antibodyMlPerStrip} mL, 1:5000 in blocking solution, 1 h RT; rinse 3× and wash 3 × 5 min in TBS-T</td></tr>
        <tr><td class="k">Detection</td><td>ECL, ${P.ecl.mlPerMembrane} mL per membrane (1:1), ${esc(P.ecl.imager)}</td></tr>
      </tbody></table>
      ${Pl.advice.length ? `<div class="callout warn"><ul>${Pl.advice.map(a => `<li>${esc(a[1])}</li>`).join("")}</ul></div>` : ""}
    </div>
    <div class="card">
      <div class="card-head"><h2>Antibodies for ${Pl.nGels} membrane${Pl.nGels > 1 ? "s" : ""}</h2></div>
      ${Pl.T.length ? `<div class="table-wrap"><table><thead><tr><th>Target</th><th class="num">Primary</th><th class="num">Primary needed</th><th>Secondary</th><th class="num">Secondary needed</th></tr></thead><tbody>${abRows}</tbody></table></div>` : `<p class="note">Add targets first.</p>`}
      ${Pl.checks.filter(c => c[0] !== "info").length ? `<div class="callout bad"><ul>${Pl.checks.filter(c => c[0] !== "info").map(c => `<li>${esc(c[1])}</li>`).join("")}</ul></div>` : ""}
    </div>
  </div>
  <div class="card">
    <div class="card-head"><h2>Cutting plan</h2><span class="hint">${esc(P.ladder.name)}. Cuts are placed midway (log scale) between neighbouring targets.</span></div>

  </div>
  <div class="grid2">
    <div class="card"><h3>Samples, per lane</h3><div class="table-wrap"><table><thead><tr><th>Lane</th><th>Sample</th><th class="num">Lysate µL</th><th class="num">Buffer µL</th><th class="num">${esc(P.loading.topUp)} µL</th></tr></thead><tbody>
      ${Pl.lanes.map((g, gi) => g.map((l, i) => l.s ? (() => { const r = Pl.R.rows.find(x => x.id === l.s.id); return `<tr><td>${Pl.lanes.length > 1 ? `G${gi + 1}·` : ""}${i + 1}</td><td>${esc(l.s.name)}</td><td class="num">${r && r.top >= 0 ? fmtUL(r.lys) : "–"}</td><td class="num">${fmtUL(Pl.R.lane / Pl.R.X)}</td><td class="num">${r && r.top >= 0 ? fmtUL(r.top) : "–"}</td></tr>`; })() : l.ladder ? `<tr class="dim"><td>${Pl.lanes.length > 1 ? `G${gi + 1}·` : ""}${i + 1}</td><td>Ladder</td><td class="num">${P.loading.ladderUL}</td><td></td><td></td></tr>` : "").join("")).join("")}
    </tbody></table></div></div>
    <div class="card"><h3>Antibodies</h3><div class="table-wrap"><table><thead><tr><th>Target</th><th class="num">Primary</th><th class="num">µL needed</th><th>Secondary</th></tr></thead><tbody>
      ${Pl.T.map(t => `<tr><td>${esc(t.target)}</td><td class="num">1:${isFinite(t.dil) ? t.dil : "?"}</td><td class="num">${isFinite(t.dil) ? fmtUL(t.ml * Pl.nGels * 1000 / t.dil) : "–"}</td><td>${t.sec ? esc(t.sec.name) + " 1:" + t.sec.dil : "none"}</td></tr>`).join("")}
    </tbody></table></div></div>
  </div>`;
}
function summaryText() {
  const Pl = plan(), I = issues(Pl), f = Pl.F.f, c = Pl.cast, L = [];
  L.push(`WESTERN BLOT PLAN: ${S.name || "untitled"} (${new Date().toLocaleDateString()})`, "");
  if (I.length) { L.push("CHECK FIRST:"); I.forEach(i => L.push(" - " + i[1])); L.push(""); }
  L.push(`Loading: ${Pl.R.ug} µg in ${Pl.R.lane} µL per lane, ${Pl.R.sb.name}`);
  L.push(`Gel: ${Pl.pct}% / ${P.stacking.pct}%${f ? `, ${f.wells}-well ${f.mm} mm, ${Pl.nGels} gel(s)` : ""}`);
  if (c && c.res) { L.push(`Resolving ${c.Vres} mL: ` + P.resolving.components.map((n, i) => `${n} ${c.res[i] >= 1 || i === 0 ? fmt(c.res[i], 1) + " mL" : Math.round(c.res[i] * 1000) + " µL"}`).join("; "));
                    L.push(`Stacking ${c.Vst} mL: ` + P.stacking.components.map((n, i) => `${n} ${c.st[i] >= 1 || i === 0 ? fmt(c.st[i], 1) + " mL" : Math.round(c.st[i] * 1000) + " µL"}`).join("; ")); }
  L.push("", "Lane\tSample\tLysate µL\tBuffer µL\t" + P.loading.topUp + " µL");
  Pl.lanes.forEach((g, gi) => g.forEach((l, i) => { const lane = (Pl.lanes.length > 1 ? `G${gi + 1}-` : "") + (i + 1);
    if (l.ladder) L.push(`${lane}\tLadder\t${P.loading.ladderUL}`); else if (l.s) { const r = Pl.R.rows.find(x => x.id === l.s.id); L.push(`${lane}\t${l.s.name}\t${r && r.top >= 0 ? fmtUL(r.lys) : "-"}\t${fmtUL(Pl.R.lane / Pl.R.X)}\t${r && r.top >= 0 ? fmtUL(r.top) : "-"}`); } }));
  L.push("", "Strips:"); Pl.strips.groups.forEach((g, i) => L.push(`  Strip ${i + 1}: ${g.map(t => t.target).join(" -> ")}${i < Pl.strips.cuts.length ? `  | cut ~${Pl.strips.cuts[i].kDa} kDa` : ""}`));
  L.push("", "Antibodies:"); Pl.T.forEach(t => L.push(`  ${t.target}: 1:${isFinite(t.dil) ? t.dil : "?"}, ${isFinite(t.dil) ? fmtUL(t.ml * Pl.nGels * 1000 / t.dil) : "-"} µL; secondary ${t.sec ? t.sec.name + " 1:" + t.sec.dil : "none"}`));
  return L.join("\n");
}

// ---------- Recipes ----------
const RECIPE_SCALE = {};
function scaleAmount(it, factor) {
  const v = it.amount * factor; if (it.unit === "tablet") return `${fmt(v, v % 1 ? 1 : 0)} tablet${v === 1 ? "" : "s"}`;
  const toBase = { g: 1, mg: 0.001, mL: 1, "µL": 0.001 }[it.unit], kind = it.unit === "g" || it.unit === "mg" ? "mass" : "vol", b = v * toBase;
  if (kind === "mass") return b >= 1 ? `${fmt(b, b >= 100 ? 1 : 2)} g` : `${fmt(b * 1000, 1)} mg`;
  return b >= 1 ? `${fmt(b, b >= 100 ? 0 : 2)} mL` : `${fmt(b * 1000, 1)} µL`;
}
function renderRecipes() {
  const sections = [...new Set(P.recipes.map(r => r.section))];
  $("#tab-recipes").innerHTML = `
  <div class="card"><div class="card-head"><h2>Recipes</h2><span class="hint">From the lab SOP. Type the volume you want to make; amounts scale automatically.</span></div></div>
  ${sections.map(sec => `<div class="card"><h3>${esc(sec)}</h3><div class="grid2">${P.recipes.filter(r => r.section === sec).map(r => {
    const target = RECIPE_SCALE[r.id] ?? r.baseMl, factor = r.baseMl ? num(target) / r.baseMl : 1;
    return `<div class="recipe"><h2>${esc(r.name)}</h2>
      ${r.baseMl ? `<label class="field" for="rv-${r.id}">Volume to make (mL)<input id="rv-${r.id}" data-num data-recipe="${r.id}" value="${esc(target)}"></label>` : ""}
      <table><tbody data-recipe-out="${r.id}">${recipeRows(r, factor)}</tbody></table>
      <p class="note">${esc(r.steps)}</p>
      ${r.check ? `<div class="callout warn"><b>To check:</b> ${esc(r.check)}</div>` : ""}</div>`; }).join("")}</div></div>`).join("")}`;
}
function recipeRows(r, factor) { return r.items.map(it => `<tr><td>${esc(it.name)}</td><td class="num">${it.conc ? esc(it.conc) : isFinite(factor) && factor > 0 ? scaleAmount(it, factor) : "–"}</td></tr>`).join(""); }

// ---------- Lab presets ----------
let EDIT_MODE = false;
function renderPresets() {
  const abRows = P.antibodies.map(a => `<tr class="${a.status !== "active" ? "dim" : ""}"><td>${esc(a.target)}</td><td>${esc(a.supplier)} ${esc(a.catalog)}</td><td>${esc(a.host || "?")}</td><td class="num">${a.kDa ?? "–"}</td><td class="num">${a.dil ? "1:" + a.dil : "–"}</td><td>${esc(a.status)}</td><td>${a.verified ? `<span class="chip ok">verified</span>` : `<span class="chip warn">to verify</span>`}</td><td class="note">${esc(a.notes)}</td></tr>`).join("");
  const secRows = P.secondaries.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.supplier)} ${esc(s.catalog)}</td><td>${esc(s.raisedIn || "?")}</td><td>${esc(s.against)}</td><td class="num">1:${s.dil}</td><td>${esc(s.status)}</td></tr>`).join("");
  $("#tab-presets").innerHTML = `
  <div class="card">
    <div class="card-head"><h2>Lab presets</h2><span class="hint">Presets version ${esc(P.meta.presetsVersion)}, updated ${esc(P.meta.updated)}. Maintained by the lab manager.</span></div>
    ${PRESETS_OVERRIDDEN ? `<div class="callout warn">This browser is using <b>unpublished preset edits</b>. Other people don't see them until you download the updated app file and replace the shared one. <button type="button" data-act="dropOverride">Discard my edits</button></div>` : ""}
    <div class="row"><button type="button" data-act="toggleEdit">${EDIT_MODE ? "Close editor" : "Edit presets (lab manager)"}</button>
      <button type="button" data-act="exportPresets">Export presets (JSON)</button></div>
    ${EDIT_MODE ? `<div class="callout">Edit the presets below (JSON). <b>Apply</b> uses them in this browser to test; <b>Download updated app</b> gives you a new copy of this file with the presets built in. Replace the shared file with it so everyone gets the change.</div>
      <textarea class="json" id="presetsJson" spellcheck="false" aria-label="Presets JSON">${esc(JSON.stringify(P, null, 2))}</textarea>
      <div class="row"><button type="button" data-act="applyPresets">Apply in this browser</button><button type="button" class="primary" data-act="downloadApp">Download updated app</button><span class="note" id="pjMsg"></span></div>` : ""}
  </div>
  <div class="card"><div class="card-head"><h3>Primary antibodies (Western)</h3><span class="hint">${P.antibodies.filter(a => !a.verified).length} of ${P.antibodies.length} still to verify against the datasheet</span></div>
    <div class="table-wrap"><table><thead><tr><th>Target</th><th>Catalogue</th><th>Host</th><th class="num">kDa</th><th class="num">Dilution</th><th>Status</th><th></th><th>Notes</th></tr></thead><tbody>${abRows}</tbody></table></div></div>
  <div class="card"><h3>HRP secondaries</h3><div class="table-wrap"><table><thead><tr><th>Name</th><th>Catalogue</th><th>Raised in</th><th>Against</th><th class="num">Dilution</th><th>Status</th></tr></thead><tbody>${secRows}</tbody></table></div></div>
  <div class="grid2">
    <div class="card"><h3>Gels (Bio-Rad Mini-PROTEAN)</h3><table><thead><tr><th>Wells</th><th class="num">1.0 mm</th><th class="num">1.5 mm</th></tr></thead><tbody>${Object.keys(P.wells).map(w => `<tr><td>${w}-well, max µL</td><td class="num">${P.wells[w]["1.0"]}</td><td class="num">${P.wells[w]["1.5"]}</td></tr>`).join("")}
      <tr><td>Cassette volume, mL</td><td class="num">${P.cassetteMl["1.0"]}</td><td class="num">${P.cassetteMl["1.5"]}</td></tr></tbody></table>
      <p class="note">Resolving ${Math.round(P.resolvingFraction * 100)}% / stacking ${Math.round((1 - P.resolvingFraction) * 100)}% of the cassette; +${P.castExtraPct}%, rounded up to ${P.castRoundUpMl} mL.</p></div>
    <div class="card"><h3>Gel % ranges</h3><table><thead><tr><th>Gel</th><th class="num">Separates (kDa)</th></tr></thead><tbody>${P.gelRanges.map(r => `<tr><td>${r[0]}%</td><td class="num">${r[1]}–${r[2]}</td></tr>`).join("")}</tbody></table><p class="note">Rules of thumb for Tris-glycine gels. Adjust to the lab's experience.</p></div>
    <div class="card"><h3>Ladder</h3><p>${esc(P.ladder.name)}</p><p class="note">${P.ladder.bands.map(b => bandHTML(b)).join(" · ")}</p></div>
    <div class="card"><h3>Sample buffers</h3><table><tbody>${P.sampleBuffers.map(b => `<tr><td>${esc(b.name)}</td><td class="num">${b.x}×${num(b.dttFinalMM) > 0 ? ` + ${b.dttFinalMM} mM DTT` : ""}</td></tr>`).join("")}</tbody></table></div>
  </div>`;
}

/* =====================================================================
   6. ROUTING, BINDING, ACTIONS
   ===================================================================== */
const TABS = { assay: [renderAssay, updateAssay], targets: [renderTargets, updateTargets], loading: [renderLoading, updateLoading], gel: [renderGel], blotting: [renderBlotting], buffers: [renderBuffers], summary: [renderSummary], recipes: [renderRecipes], presets: [renderPresets] };
const cur = () => { const h = location.hash.slice(1); return TABS[h] ? h : "assay"; };
function show() {
  const t = cur();
  Object.keys(TABS).forEach(x => $("#tab-" + x).classList.toggle("active", x === t));
  $$("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + t ? "page" : "false"));
  TABS[t][0](); syncRunBar();
}
function refresh() { const t = cur(); (TABS[t][1] || TABS[t][0])(); syncRunBar(); }
function syncRunBar() {
  if (document.activeElement !== $("#runName")) $("#runName").value = S.name || "";
  if (document.activeElement !== $("#runCopies")) $("#runCopies").value = S.copies;
  const Pl = plan(); $("#runInfo").textContent = Pl.F.f ? `${Pl.A.samples.length} samples · ${Pl.F.f.wells}-well ${Pl.F.f.mm} mm · ${Pl.nGels} gel${Pl.nGels > 1 ? "s" : ""} · ${Pl.pct}%` : "";
}
function setPath(o, path, v) { const k = path.split("."); for (let i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length - 1]] = v; }

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind) {
    let v = el.type === "checkbox" ? el.checked : el.value;
    if (el.dataset.int !== undefined) v = parseInt(v, 10);
    setPath(S, el.dataset.bind, v); saveDraft();
    if (el.dataset.re !== undefined && el.tagName === "SELECT") TABS[cur()][0](); else refresh();
  } else if (el.dataset.recipe) {
    const r = P.recipes.find(x => x.id === el.dataset.recipe); RECIPE_SCALE[r.id] = el.value;
    $(`[data-recipe-out="${r.id}"]`).innerHTML = recipeRows(r, num(el.value) / r.baseMl);
  }
});
document.addEventListener("change", e => { if (e.target.id === "runCopies") TABS[cur()][0](); });

// Paste a block from Excel / plate reader into the standards or samples grid
document.addEventListener("paste", e => {
  const el = e.target; if (!el.dataset || !el.dataset.grid) return;
  const text = (e.clipboardData || window.clipboardData).getData("text"); if (!/[\t\n]/.test(text.trim())) return;
  e.preventDefault();
  const rows = text.replace(/\r/g, "").replace(/\n+$/, "").split("\n").map(l => l.split("\t"));
  const grid = el.dataset.grid, r0 = +el.dataset.r, c0 = +el.dataset.c, list = grid === "stds" ? S.assay.stds : S.assay.samples;
  rows.forEach((cells, dr) => {
    const r = r0 + dr; if (!list[r]) list[r] = grid === "stds" ? { c: "", abs: ["", "", ""] } : newSample();
    cells.forEach((v, dc) => { const c = c0 + dc; v = v.trim();
      if (grid === "stds") { if (c === 0) list[r].c = v; else if (c <= 3) list[r].abs[c - 1] = v; }
      else { if (c === 0) list[r].name = v; else if (c === 1) list[r].dil = v; else if (c <= 4) list[r].abs[c - 2] = v; } });
  });
  const lastCol = c0 + Math.max(...rows.map(r => r.length)) - 1, reps = grid === "stds" ? lastCol : lastCol - 1;
  if (reps > S.assay.reps && reps <= 3) S.assay.reps = reps;
  saveDraft(); renderAssay(); toast(`Pasted ${rows.length} row${rows.length > 1 ? "s" : ""}`);
});

function download(name, text, type = "application/json") {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast("Copied"); } catch { download("western-plan.txt", t, "text/plain"); toast("Clipboard blocked: saved as a text file instead"); } }

const ACTIONS = {
  newPlan() { if (!S.example && !confirm("Start a new experiment? The current one is replaced (save it to a file first if you need it).")) return; S = blankState(); saveDraft(); show(); },
  addStd() { S.assay.stds.push({ c: "", abs: ["", "", ""] }); renderAssay(); },
  delStd(d) { S.assay.stds.splice(+d.i, 1); renderAssay(); },
  addSample() { S.assay.samples.push(newSample()); renderAssay(); },
  delSample(d) { S.assay.samples.splice(+d.i, 1); renderAssay(); },
  moveSample(d) { const i = +d.i, j = i + +d.d, a = S.assay.samples; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; renderAssay(); },
  setFit(d) { S.assay.fit = d.fit; updateAssay(); },
  addTarget() { S.targets.push(newTarget()); renderTargets(); },
  delTarget(d) { S.targets.splice(+d.i, 1); renderTargets(); },
  copySummary() { copyText(summaryText()); },
  print() { window.print(); },
  exportPlan() { download(`${(S.name || "western-plan").replace(/[^\w\- ]+/g, "").trim() || "western-plan"}.json`, JSON.stringify({ app: "western-blot-planner", ...S }, null, 2)); },
  importPlan() { $("#importPlan").click(); },
  toggleEdit() { EDIT_MODE = !EDIT_MODE; renderPresets(); },
  exportPresets() { download("lab-presets.json", JSON.stringify(P, null, 2)); },
  applyPresets() { const p = readPresetsEditor(); if (!p) return; P = p; PRESETS_OVERRIDDEN = true; try { localStorage.setItem(OVERRIDE_KEY, JSON.stringify(P)); } catch {} renderPresets(); toast("Presets applied in this browser"); },
  downloadApp() {
    const p = readPresetsEditor(); if (!p) return;
    const json = JSON.stringify(p, null, 2).replace(/</g, "\\u003c");
    const out = APP_SOURCE.replace(/(<script type="application\/json" id="lab-presets">)[\s\S]*?(<\/script>)/, `$1\n${json}\n$2`);
    download("western-blot-planner.html", out, "text/html"); toast("Downloaded. Replace the shared file with it.");
  },
  dropOverride() { try { localStorage.removeItem(OVERRIDE_KEY); } catch {} ({ P, overridden: PRESETS_OVERRIDDEN } = loadPresets()); renderPresets(); toast("Back to the shared presets"); }
};
function readPresetsEditor() {
  try { const p = JSON.parse($("#presetsJson").value); if (!p.antibodies || !p.resolving || !p.wells) throw new Error("antibodies, resolving or wells missing"); $("#pjMsg").textContent = ""; return p; }
  catch (err) { $("#pjMsg").textContent = "Not valid: " + err.message; return null; }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b) return; const fn = ACTIONS[b.dataset.act]; if (fn) { fn(b.dataset); saveDraft(); } });
$("#importPlan").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (d.app !== "western-blot-planner") throw 0; delete d.app; S = { ...blankState(), ...d, example: false }; saveDraft(); show(); toast(`Opened ${f.name}`); }
  catch { toast("That file isn't a saved plan"); }
  e.target.value = "";
});
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
