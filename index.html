<style>
/* Bench tool: sticky header with run bar, one tab per step. Coomassie-blue accent. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --ink: #161a24; --muted: #5b6273; --line: #dde0e8;
  --accent: #2a4bb3; --accent-soft: #e6ebfa;
  --good: #1f7a4a; --warn: #9a5b00; --warn-soft: #fff3df; --bad: #b3261e; --bad-soft: #fde8e6; --gel: #dfe6f6;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12141b; --surface: #1b1e27; --ink: #e8eaf0; --muted: #9aa1b2; --line: #2e3240;
    --accent: #8ea6ff; --accent-soft: #252c47; --good: #5fcf8f; --warn: #f0b354; --warn-soft: #3a2e17; --bad: #ff8a80; --bad-soft: #3d1f1d; --gel: #263052; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #12141b; --surface: #1b1e27; --ink: #e8eaf0; --muted: #9aa1b2; --line: #2e3240;
  --accent: #8ea6ff; --accent-soft: #252c47; --good: #5fcf8f; --warn: #f0b354; --warn-soft: #3a2e17; --bad: #ff8a80; --bad-soft: #3d1f1d; --gel: #263052; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
p { margin: 0; }
.num, td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; max-width: 1240px; margin: 0 auto; }
.top-row .spacer { flex: 1; }
.ver { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 16px; max-width: 1240px; margin: 0 auto; }
nav.tabs a { padding: 9px 11px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; font-size: 14px; }
nav.tabs a .n { font-family: var(--font-mono); font-size: 12px; margin-right: 5px; opacity: .7; }
nav.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.runbar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 8px 16px; max-width: 1240px; margin: 0 auto; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.runbar label { display: inline-flex; gap: 6px; align-items: center; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

main { max-width: 1240px; margin: 0 auto; padding: 16px; }
section.tab { display: none; gap: 16px; }
section.tab.active { display: grid; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.card-head .hint { color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; }
.fields { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.field { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
input[data-num] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; width: 84px; text-align: right; }
td input { width: 100%; min-width: 62px; }
td input.name, input.name { text-align: left; min-width: 120px; font-family: var(--font-body); }
input[type="checkbox"] { width: auto; accent-color: var(--accent); }
textarea.json { width: 100%; min-height: 420px; font-family: var(--font-mono); font-size: 12px; }
button { font: inherit; font-size: 14px; border-radius: 6px; padding: 6px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
:root[data-theme="dark"] button.primary { color: #10131c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #10131c; } }
button:disabled { opacity: .45; cursor: not-allowed; }
button.ghost { border-color: transparent; color: var(--muted); padding: 3px 7px; }
button.ghost:hover { color: var(--ink); }
button.ghost.del:hover { color: var(--bad); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: bottom; }
th.num, td.num { text-align: right; }
td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.k { width: 140px; vertical-align: top; font-weight: 600; }
tr.dim td { color: var(--muted); }

.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; font-family: var(--font-body); margin: 1px 0; }
.chip.ok { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.chip.warn { color: var(--warn); background: var(--warn-soft); }
.chip.bad { color: var(--bad); background: var(--bad-soft); }
.chip.info { color: var(--accent); background: var(--accent-soft); }
.note { font-size: 13px; color: var(--muted); }
.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 14px; }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.callout.bad { border-color: var(--bad); background: var(--bad-soft); }
.callout ul { margin: 4px 0 0; padding-left: 18px; }

.fitbox { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.fitopt { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.fitopt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.fitopt .big { font-family: var(--font-mono); font-size: 19px; font-weight: 500; }
.fitopt .eq { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
svg.chart { width: 100%; height: auto; max-height: 320px; }
svg.chart text { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
svg.chart .grid { stroke: var(--line); }
svg.chart .axis { stroke: var(--muted); }
svg.chart .curve { fill: none; stroke: var(--accent); stroke-width: 2; }
svg.chart .curve2 { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: .7; }
svg.chart .std { fill: var(--accent); }
svg.chart .smp { fill: var(--warn); stroke: var(--surface); }
svg.chart .smp.bad { fill: var(--bad); }

.gel { background: var(--gel); border-radius: 8px; padding: 12px; overflow-x: auto; }
.gel + .gel { margin-top: 10px; }
.gel .gt { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.wells { display: grid; gap: 5px; min-width: max-content; }
.well { display: grid; gap: 5px; justify-items: center; width: 52px; }
.well .slot { width: 100%; height: 14px; border-radius: 0 0 4px 4px; background: color-mix(in srgb, var(--ink) 15%, transparent); }
.well.filled .slot { background: var(--accent); }
.well.ladder .slot { background: linear-gradient(90deg, #3b6fd8, #d8336b, #4c9a2a, #e3a300, #7d4bc4); }
.well .lane-n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.well .lab { font-size: 11px; height: 92px; writing-mode: vertical-rl; transform: rotate(180deg); overflow: hidden; }

.strips { display: grid; gap: 6px; }
.strip { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.strip .range { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.cutline { font-size: 13px; color: var(--accent); display: flex; align-items: center; gap: 8px; padding-left: 6px; }
.cutline::before { content: ""; flex: 0 0 36px; border-top: 2px dashed var(--accent); }
.band { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; border: 1px solid rgb(0 0 0 / .15); }

table.plate { border-collapse: separate; border-spacing: 2px; width: auto; user-select: none; touch-action: none; }
table.plate th.ph { cursor: pointer; text-align: center; padding: 2px 4px; }
table.plate th.ph:hover { color: var(--accent); }
table.plate td.pw { width: 46px; min-width: 46px; height: 38px; border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; cursor: crosshair; vertical-align: top; }
table.plate td.pw .v { display: block; font-family: var(--font-mono); font-size: 11px; }
table.plate td.pw .t { display: block; font-size: 10px; font-weight: 600; color: var(--muted); }
table.plate td.pw.sel { outline: 2px solid var(--accent); outline-offset: -1px; }
.recipe { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.recipe h2 { font-size: 15px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } .strip { grid-template-columns: 1fr; } }
@media print {
  header.top, .noprint, nav { display: none !important; }
  body { background: #fff; color: #000; }
  section.tab { display: none !important; }
  section.tab.active { display: grid !important; }
  .card { border: 0; padding: 0; }
}
</style>
</head>

<header class="top">
  <div class="top-row">
    <h1>Western Blot Planner</h1><span class="ver">v1.2</span>
    <span class="spacer"></span>
    <button type="button" data-act="exportPlan">Save plan to file</button>
    <label class="noprint" style="display:inline-flex"><input type="file" id="importPlan" accept=".json,application/json" hidden><button type="button" data-act="importPlan">Open plan file</button></label>
    <button type="button" data-act="newPlan">New experiment</button>
  </div>
  <nav class="tabs" aria-label="Steps">
    <a href="#assay"><span class="n">1</span>Protein assay</a>
    <a href="#targets"><span class="n">2</span>Targets</a>
    <a href="#loading"><span class="n">3</span>Loading</a>
    <a href="#gel"><span class="n">4</span>Gel</a>

      <span class="note">Or type it per sample in the table.</span></div>
    <div class="table-wrap"><table><thead><tr><th>Sample</th><th class="num">µg/µL</th><th class="num">Lysate µL</th><th class="num" data-k="lh-sb">Sample buffer µL</th><th class="num" data-k="lh-dtt"></th><th class="num">${esc(P.loading.topUp)} µL</th>
      <th class="num">Lysate left µL</th><th class="num">Max loads</th><th class="num" data-k="lh-need">Needed</th><th>Check</th></tr></thead>
    <tbody>${S.assay.samples.map((sm, i) => `<tr><td>${esc(sm.name || "Sample " + (i + 1))}</td><td class="num" data-k="lc${i}"></td><td class="num" data-k="ll${i}"></td><td class="num" data-k="lb${i}"></td><td class="num" data-k="ld${i}"></td><td class="num" data-k="lt${i}"></td>
      <td><input data-num data-bind="assay.samples.${i}.avail" value="${esc(sm.avail)}" aria-label="µL of lysate left" style="width:72px"></td><td class="num" data-k="lm${i}"></td><td class="num" data-k="ln${i}"></td><td data-k="lf${i}"></td></tr>`).join("")}</tbody></table></div>
    <p class="note">Max loads = lysate left ÷ (lysate per lane + ${P.loading.reserveExtraPct}% pipetting reserve), rounded down. "Needed" = lysate for the loads you plan, with the same reserve.</p>

}
function updateLoading() {
  const Pl = plan(), R = Pl.R, set = (k, h) => { const el = $(`[data-k="${k}"]`); if (el) el.innerHTML = h; };
  set("lh-sb", `${esc(R.sb.name.split(" ")[0])} buffer µL`); set("lh-dtt", num(R.sb.dttFinalMM) > 0 ? "DTT 1 M µL" : "");
  set("lh-need", `For ${R.loads} load${R.loads > 1 ? "s" : ""}`);
  R.rows.forEach((r, i) => { const ok = isFinite(r.lys) && r.top >= 0;
    set("lc" + i, fmt(r.conc, 2)); set("ll" + i, ok ? `<b>${fmtUL(r.lys)}</b>` : "–"); set("lb" + i, fmtUL(r.sbUL)); set("ld" + i, num(R.sb.dttFinalMM) > 0 ? fmtUL(r.dttUL) : "");
    set("lt" + i, ok ? fmtUL(r.top) : "–"); set("lm" + i, isFinite(r.loadsFromAvail) ? `<b>${r.loadsFromAvail}</b>` : `<span class="note">enter µL</span>`);
    set("ln" + i, isFinite(r.need) ? fmtUL(r.need) + " µL" : "–"); set("lf" + i, r.flags.length ? chips(r.flags) : `<span class="chip ok">OK</span>`); });
  const ls = $('[data-out="lsum"]');
  if (ls) {
    const f = Pl.F.f;
    ls.innerHTML = `<div class="callout">${R.lane} µL per lane${S.load.laneMode === "auto" ? " (smallest that fits every sample)" : ""}: lysate + ${fmtUL(R.lane / R.X)} µL of ${R.X}× buffer${num(R.sb.dttFinalMM) > 0 ? " + DTT" : ""}, topped up with ${esc(P.loading.topUp.toLowerCase())}.
      ${R.limiting ? `<br>Most dilute sample: <b>${esc(R.limiting.name)}</b> (${fmt(R.limiting.conc, 2)} µg/µL).` : ""}
      ${(() => { const w = R.rows.filter(r => isFinite(r.loadsFromAvail)); if (!w.length) return ""; const m = w.reduce((a, b) => a.loadsFromAvail <= b.loadsFromAvail ? a : b);
        return `<br>Max repeats at ${R.ug} µg: <b>${m.loadsFromAvail}</b>, limited by ${esc(m.name)}${w.length < R.rows.length ? ` (${R.rows.length - w.length} sample${R.rows.length - w.length > 1 ? "s" : ""} without µL left)` : ""}.`; })()}
      ${f ? `<br>Gel: <b>${f.wells}-well, ${f.mm} mm</b> (max ${f.maxUL} µL), ${f.gels} gel${f.gels > 1 ? "s" : ""} per set.` : ""}</div>
      ${Pl.F.overWell && f ? `<div class="callout bad">${R.lane} µL doesn't fit a ${f.wells}-well ${f.mm} mm well (${f.maxUL} µL). Load fewer µg or pick another gel.</div>` : ""}
      ${!f ? `<div class="callout bad">${R.lane} µL per lane doesn't fit any well. Lower the µg per lane (see the table on the right).</div>` : ""}
      <p class="note">Denature: ${esc(P.loading.denature)}. Ladder: ${P.loading.ladderUL} µL.</p>
      ${Pl.T.some(t => t.ab && t.ab.noBoil) ? `<div class="callout warn">Don't boil for ${Pl.T.filter(t => t.ab && t.ab.noBoil).map(t => esc(t.target)).join(", ")}: follow the datasheet (often 37 °C for 10–30 min).</div>` : ""}
      ${Pl.T.some(t => t.ab && t.ab.nonReducing) && R.sb.reducing !== false ? `<div class="callout bad">${Pl.T.filter(t => t.ab && t.ab.nonReducing).map(t => esc(t.target)).join(", ")} need non-reducing conditions, but this sample buffer contains a reducing agent.</div>` : ""}`;
  }
  const mu = $('[data-out="maxug"]');
  if (mu) { const rows = maxUgPerWell(Pl.A); mu.innerHTML = rows.length ? `<table><thead><tr><th>Well</th><th class="num">µL</th><th class="num">Max µg</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.w}-well, ${r.mm} mm</td><td class="num">${r.v}</td><td class="num"><b>${fmt(r.ug, 1)}</b></td><td>${r.ug >= R.ug ? `<span class="chip ok">fits ${R.ug} µg</span>` : ""}</td></tr>`).join("")}</tbody></table>` : `<p class="note">Enter the protein assay first.</p>`; }
}

// ---------- 5 Blotting ----------
function renderBlotting() {
  const Pl = plan(), st = Pl.strips;
  const stripsHTML = st.groups.map((g, i) => {
    const top = i === 0 ? "top" : `≈${st.cuts[i - 1].kDa} kDa`, bot = i === st.groups.length - 1 ? "bottom" : `≈${st.cuts[i].kDa} kDa`;
    const ordered = g;   // already in probing order (phospho, its total, then the rest)
    const tl = ordered.map(t => `<b>${esc(t.target)}</b> <span class="note">${bandTxt(t)}, ${esc(t.host || "?")}${isFinite(t.dil) ? ", 1:" + t.dil : ""}</span>`).join(g.length > 1 ? `<br><span class="note">↓ strip: ${esc(P.stripping.conditions)}; reblock, then</span><br>` : "");
    let cut = "";
    if (i < st.cuts.length) { const c = st.cuts[i];
      cut = `<div class="cutline">Cut ${c.band ? `at the ${bandHTML(c.band)} marker` : `between the ${c.above ? bandHTML(c.above) : "top"} and ${c.below ? bandHTML(c.below) : "bottom"} markers`} (between ${c.lo} and ${c.hi} kDa)</div>`; }
    return `<div class="strip"><span class="range">Strip ${i + 1}<br>${top} → ${bot}</span><div>${tl}${g.length > 1 ? `<div class="note" style="margin-top:4px">Too close in size to cut apart: probe in this order${g.some(t => isPhospho(t.target)) ? " (phospho first, then total)" : ""}.</div>` : ""}</div></div>${cut}`;
  }).join("");
  const abRows = Pl.T.map(t => { const ml = t.ml * Pl.nGels; return `<tr><td>${esc(t.target)}<div class="note">${esc([t.diluent || `${P.blocking.pct}% ${P.blocking.agent.toLowerCase()} TBS-T`, t.incubation || "2 h RT or overnight 4 °C"].join(" · "))}</div></td><td class="num">1:${isFinite(t.dil) ? t.dil : "?"}</td><td class="num"><b>${isFinite(t.dil) ? fmtUL(ml * 1000 / t.dil) : "–"}</b> µL in ${fmtML(ml)} mL</td><td>${t.sec ? esc(t.sec.name) + " " + esc(t.sec.catalog) : "–"}</td><td class="num">${t.sec ? fmtUL(ml * 1000 / t.sec.dil) + " µL" : "–"}</td></tr>`; }).join("");
  $("#tab-blotting").innerHTML = `
  <div class="grid2">
    <div class="card">
      <div class="card-head"><h2>Transfer and detection</h2><span class="hint">Lab SOP. Warnings appear only when your targets need something different.</span></div>
      <table><tbody>
        <tr><td class="k">Transfer</td><td>${esc(P.transfer.method)}: ${esc(P.transfer.conditions)}; ${P.transfer.methanolPct}% methanol${P.transfer.membrane ? "; " + esc(P.transfer.membrane) : ""}</td></tr>
        <tr><td class="k">Check</td><td>Ponceau S after transfer, before cutting.</td></tr>
        <tr><td class="k">Blocking</td><td>${P.blocking.pct}% ${esc(P.blocking.agent.toLowerCase())} in TBS-T, ${esc(P.blocking.time)}</td></tr>
        <tr><td class="k">Primary</td><td>2 h RT or overnight at 4 °C on a roller</td></tr>
        <tr><td class="k">Secondary</td><td>${P.antibodyMlPerStrip} mL, 1:5000 in blocking solution, 1 h RT; rinse 3× and wash 3 × 5 min in TBS-T</td></tr>
        <tr><td class="k">Detection</td><td>ECL, ${P.ecl.mlPerMembrane} mL per membrane (1:1), ${esc(P.ecl.imager)}</td></tr>
      </tbody></table>
      ${Pl.advice.length ? `<div class="callout warn"><ul>${Pl.advice.map(a => `<li>${esc(a[1])}</li>`).join("")}</ul></div>` : ""}
    </div>
    <div class="card">
      <div class="card-head"><h2>Antibodies for ${Pl.nGels} membrane${Pl.nGels > 1 ? "s" : ""}</h2></div>
      ${Pl.T.length ? `<div class="table-wrap"><table><thead><tr><th>Target</th><th class="num">Primary</th><th class="num">Primary needed</th><th>Secondary</th><th class="num">Secondary needed</th></tr></thead><tbody>${abRows}</tbody></table></div>` : `<p class="note">Add targets first.</p>`}
      ${Pl.checks.filter(c => c[0] !== "info").length ? `<div class="callout bad"><ul>${Pl.checks.filter(c => c[0] !== "info").map(c => `<li>${esc(c[1])}</li>`).join("")}</ul></div>` : ""}
    </div>
  </div>
  <div class="card">
    <div class="card-head"><h2>Cutting plan</h2><span class="hint">${esc(P.ladder.name)}. One cut between every pair of neighbouring targets that are far enough apart, placed midway (log scale).</span></div>
    <div class="fields"><label class="field" for="cutGap">Cut between targets that differ in size by at least<select id="cutGap" data-bind="load.cutGap" data-re="1">
      ${[10, 15, 20, 25, 35].map(g => `<option value="${g}" ${Math.round((cutRatio() - 1) * 100) === g ? "selected" : ""}>${g}%${g === num(P.minCutGapPct) ? " (lab default)" : ""}</option>`).join("")}</select></label>

}

const RECIPE_SCALE = {};
function scaleAmount(it, factor) {
  const v = it.amount * factor; if (it.unit === "tablet") return `${fmt(v, v % 1 ? 1 : 0)} tablet${v === 1 ? "" : "s"}`;
  const toBase = { g: 1, mg: 0.001, mL: 1, "µL": 0.001 }[it.unit], kind = it.unit === "g" || it.unit === "mg" ? "mass" : "vol", b = v * toBase;
  if (kind === "mass") return b >= 1 ? `${fmt(b, b >= 100 ? 1 : 2)} g` : `${fmt(b * 1000, 1)} mg`;
  return b >= 1 ? `${fmt(b, b >= 100 ? 0 : 2)} mL` : `${fmt(b * 1000, 1)} µL`;
}

  } else if (el.dataset.abs) {
    const [i, sp] = el.dataset.abs.split("."), a = DRAFT.antibodies[+i]; a.bandsBySpecies = { ...(a.bandsBySpecies || {}) };
    const v = parseBands(el.value); if (v.length) a.bandsBySpecies[sp] = v; else delete a.bandsBySpecies[sp];
    a._open = true; syncDraftJson();
  } else if (el.dataset.abf || el.dataset.abb || el.dataset.aba) {
    const key = el.dataset.abf || el.dataset.abb || el.dataset.aba, [i, f] = key.split("."), a = DRAFT.antibodies[+i];
    if (el.dataset.abb) a[f] = el.checked;

// Paste a block from Excel / plate reader into the standards or samples grid
document.addEventListener("paste", e => {
  const el = e.target; if (!el.dataset || !el.dataset.grid) return;
  const text = (e.clipboardData || window.clipboardData).getData("text"); if (!/[\t\n]/.test(text.trim())) return;
  e.preventDefault();
  const rows = text.replace(/\r/g, "").replace(/\n+$/, "").split("\n").map(l => l.split("\t"));
  const grid = el.dataset.grid, r0 = +el.dataset.r, c0 = +el.dataset.c, list = grid === "stds" ? S.assay.stds : S.assay.samples;
  rows.forEach((cells, dr) => {
    const r = r0 + dr; if (!list[r]) list[r] = grid === "stds" ? { c: "", abs: ["", "", ""] } : newSample();
    cells.forEach((v, dc) => { const c = c0 + dc; v = v.trim();
      if (grid === "stds") { if (c === 0) list[r].c = v; else if (c <= 3) list[r].abs[c - 1] = v; }
      else { if (c === 0) list[r].name = v; else if (c === 1) list[r].dil = v; else if (c <= 4) list[r].abs[c - 2] = v; } });
  });
  const lastCol = c0 + Math.max(...rows.map(r => r.length)) - 1, reps = grid === "stds" ? lastCol : lastCol - 1;
  if (reps > S.assay.reps && reps <= 3) S.assay.reps = reps;
  saveDraft(); renderAssay(); toast(`Pasted ${rows.length} row${rows.length > 1 ? "s" : ""}`);
});

async function copyText(t) { try { await navigator.clipboard.writeText(t); toast("Copied"); } catch { download("western-plan.txt", t, "text/plain"); toast("Clipboard blocked: saved as a text file instead"); } }

const ACTIONS = {
  newPlan() { if (!S.example && !confirm("Start a new experiment? The current one is replaced (save it to a file first if you need it).")) return; S = blankState(); saveDraft(); show(); },
  addStd() { S.assay.stds.push({ c: "", abs: ["", "", ""] }); renderAssay(); },
  delStd(d) { S.assay.stds.splice(+d.i, 1); renderAssay(); },
  addSample() { S.assay.samples.push(newSample()); renderAssay(); },
  delSample(d) { S.assay.samples.splice(+d.i, 1); renderAssay(); },
  moveSample(d) { const i = +d.i, j = i + +d.d, a = S.assay.samples; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; renderAssay(); },
  setFit(d) { S.assay.fit = d.fit; updateAssay(); },
  availAll() { const v = num($("#availAll").value); if (!(v > 0)) return toast("Type the µL left first"); S.assay.samples.forEach(x => x.avail = v); saveDraft(); renderLoading(); toast(`${v} µL set for all samples`); },
  flipConc() { const cs = S.assay.stds.map(x => x.c).reverse(); S.assay.stds.forEach((x, i) => x.c = cs[i]); saveDraft(); renderAssay(); toast("Concentrations now highest first, blank last"); },
  applyImport() { applyImport(); },
  clearPage() {
    if (!confirm("Clear the protein assay page? Pasted data, standards and samples are removed. The plate layout is kept (use Clear layout to remove it).")) return;
    IMP.text = ""; IMP.sel = null; IMP.conc = ""; IMP.names = ""; IMP.msg = ""; IMP.serTop = ""; IMP.serF = "";
    S.example = false; S.assay = { ...S.assay, stds: [], samples: [newSample()] };
    saveDraft(); renderAssay(); toast("Page cleared");
  },
  markStd() { markSelection("std"); },
  markSmp() { markSelection("smp"); },
  serial() { serialSeries(); },
  unmarkSel() { unmark(selWells()); IMP.sel = null; updateImport(); },
  clearLayout() { IMP.units = []; IMP.sel = null; IMP.msg = ""; try { localStorage.removeItem(LAYOUT_KEY); } catch {} updateImport(); },
  addTarget() { S.targets.push(newTarget()); renderTargets(); },
  delTarget(d) { S.targets.splice(+d.i, 1); renderTargets(); },
  copySummary() { copyText(summaryText()); },
  print() { window.print(); },
  exportPlan() { download(`${(S.name || "western-plan").replace(/[^\w\- ]+/g, "").trim() || "western-plan"}.json`, JSON.stringify({ app: "western-blot-planner", ...S }, null, 2)); },
  importPlan() { $("#importPlan").click(); },
  toggleEdit() { EDIT_MODE = !EDIT_MODE; if (EDIT_MODE) { DRAFT = clone(P); JSON_DIRTY = false; } renderPresets(); },
  abAdd() { DRAFT.antibodies.push({ ...normAb({ id: "a" + uid(), target: "", catalog: "", supplier: "", host: "", status: "active", verified: false, dil: null }), _open: true }); $("#abEditor").innerHTML = abEditorHTML(); syncDraftJson(); },
  abDel(d) { const a = DRAFT.antibodies[+d.i]; if (!confirm(`Delete ${a.target || "this antibody"} (${a.catalog})?`)) return; DRAFT.antibodies.splice(+d.i, 1); DRAFT.antibodies.forEach(x => { if (x.total === a.id) x.total = ""; }); $("#abEditor").innerHTML = abEditorHTML(); syncDraftJson(); },
  exportPresets() { download("lab-presets.json", JSON.stringify(P, null, 2)); },
  applyPresets() { const p = readPresetsEditor(); if (!p) return; P = p; DRAFT = clone(P); PRESETS_OVERRIDDEN = true; try { localStorage.setItem(OVERRIDE_KEY, JSON.stringify(P)); } catch {} renderPresets(); toast("Presets applied in this browser"); },
  downloadApp() {
    const p = readPresetsEditor(); if (!p) return; p.meta = { ...p.meta, updated: new Date().toISOString().slice(0, 10) };
    const json = JSON.stringify(p, null, 2).replace(/</g, "\\u003c");
    const out = APP_SOURCE.replace(/(<script type="application\/json" id="lab-presets">)[\s\S]*?(<\/script>)/, `$1\n${json}\n$2`);
    download("index.html", out, "text/html"); toast("Downloaded index.html: replace the online file with it.");
  },
  dropOverride() { try { localStorage.removeItem(OVERRIDE_KEY); } catch {} ({ P, overridden: PRESETS_OVERRIDDEN } = loadPresets()); renderPresets(); toast("Back to the shared presets"); }
};
function readPresetsEditor() {
  try {
    const p = JSON_DIRTY ? JSON.parse($("#presetsJson").value) : cleanDraft();
    if (!p.antibodies || !p.resolving || !p.wells) throw new Error("antibodies, resolving or wells missing");
    $("#pjMsg").textContent = ""; return normPresets(p);
  } catch (err) { $("#pjMsg").textContent = "Not valid: " + err.message; return null; }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b) return; const fn = ACTIONS[b.dataset.act]; if (fn) { fn(b.dataset); saveDraft(); } });
$("#importPlan").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (d.app !== "western-blot-planner") throw 0; delete d.app; S = { ...blankState(), ...d, example: false }; saveDraft(); show(); toast(`Opened ${f.name}`); }
  catch { toast("That file isn't a saved plan"); }
  e.target.value = "";
});
window.addEventListener("hashchange", show);
show();
</script>
</body>
